<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style.css" />
    <script type="module" src="script/main.js" defer></script>
    <title>Alphamot</title>
  </head>
  <body>
    <header>
      <h1>
        <span>A</span>
        <span>L</span>
        <span>P</span>
        <span>H</span>
        <span>A</span>
        <span>M</span>
        <span>O</span>
        <span>T</span>
      </h1>
      <nav></nav>
    </header>
    <main>
      <div class="gameGrid">
        <div class="gridRow">
          <div class="activeRow activeCase correctLetter">R</div>
          <div class="activeRow misPlacedLetter">A</div>
          <div class="activeRow">N</div>
          <div class="activeRow correctLetter">A</div>
          <div class="activeRow">R</div>
          <div class="activeRow correctLetter">A</div>
        </div>
        <div class="gridRow">
          <div class="activeRow rowTest"></div>
          <div class="activeRow rowTest"></div>
          <div class="activeRow rowTest"></div>
          <div class="activeRow rowTest"></div>
          <div class="activeRow rowTest"></div>
          <div class="activeRow rowTest"></div>
        </div>
        <div class="gridRow">
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
        </div>
        <div class="gridRow">
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
        </div>
        <div class="gridRow">
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
        </div>
        <div class="gridRow">
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
          <div class="activeRow"></div>
        </div>
      </div>
      <div class="keyboard">
        <div class="firstRow">
          <button value="a">A</button>
          <button>Z</button>
          <button class="correct">E</button>
          <button>R</button>
          <button class="correct">T</button>
          <button>Y</button>
          <button>U</button>
          <button>I</button>
          <button>O</button>
          <button>P</button>
        </div>
        <div class="secondRow">
          <button data-id="">Q</button>
          <button data-id="">S</button>
          <button data-id="" class="correct">D</button>
          <button data-id="">F</button>
          <button data-id="">G</button>
          <button data-id="">H</button>
          <button data-id="" class="wrong">J</button>
          <button data-id="">K</button>
          <button data-id="">L</button>
          <button data-id="">M</button>
        </div>
        <div class="thirdRow">
          <button data-id="">Effacer</button>
          <button data-id="">W</button>
          <button data-id="">X</button>
          <button data-id="">C</button>
          <button data-id="">V</button>
          <button data-id="">B</button>
          <button data-id="">N</button>
          <button data-id="">⌫</button>
        </div>
        <button class="valider">Valider</button>
      </div>
    </main>
  </body>
</html>
