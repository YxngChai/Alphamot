<!doctype html>
<html >
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="style/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <link rel="icon" type="image/png" href="/data/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/data/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/data/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/data/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/data/favicon/site.webmanifest" />
     <script type="module" src="script/main.js" defer></script>
    <script
      src="https://kit.fontawesome.com/c8cb44d56f.js"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" ></script>

  <body>
    <header>
      <h1>
        <span>A</span>
        <span>L</span>
        <span>P</span>
        <span>H</span>
        <span>A</span>
        <span>M</span>
        <span>O</span>
        <span>T</span>
      </h1>
      <nav>
        <button class="btn-help open-help btn-help--dark" title="Help">          
          <i class="fa-solid fa-question fa-xl setting-wheel"></i>        
        </button>
        <button class="btn-settings open-settings btn-settings--dark" title="Settings">          
           <i class="fa-solid fa-gear setting-wheel"></i>
        </button>
      </nav>
    </header>
    <main>
      <div class="app">
      </div>
      <div class="endGame">
      </div>
      <!-- Game Stats -->
      <section class="statistics">
        <div class="statistics__panel">
          <div class="statistics__numbers">
            <div class="statistics_totalPlayed statistics__cell"><span data-stats="totalPlayed" class="statistics__digits"></span> <span class="statistics__text" data-i18n="played"></span></div>
            <div class="statistics_winPercentage statistics__cell"><span data-stats="winPercentage" class="statistics__digits"></span> <span class="statistics__text" data-i18n="win"></span></div>
            <div class="statistics_CurrentStreak statistics__cell"><span data-stats="currentStreak" class="statistics__digits"></span> <span class="statistics__text" data-i18n="currentStreak"></span></div>
            <div class="statistics_MaxStreak statistics__cell"><span data-stats="maxStreak" class="statistics__digits"></span> <span class="statistics__text" data-i18n="maxStreak"></span></div>
          </div>
          <div class="statistics__graph"> 
            <canvas id="myChart" class="statistics__graph-chart"></canvas>
          </div> 
        </div>
      </section>
      <!-- <div><button class="share-btn"><span>Share</span><span><svg class="share-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path  d="M342.6 73.4C330.1 60.9 309.8 60.9 297.3 73.4L169.3 201.4C156.8 213.9 156.8 234.2 169.3 246.7C181.8 259.2 202.1 259.2 214.6 246.7L288 173.3L288 384C288 401.7 302.3 416 320 416C337.7 416 352 401.7 352 384L352 173.3L425.4 246.7C437.9 259.2 458.2 259.2 470.7 246.7C483.2 234.2 483.2 213.9 470.7 201.4L342.7 73.4zM160 416C160 398.3 145.7 384 128 384C110.3 384 96 398.3 96 416L96 480C96 533 139 576 192 576L448 576C501 576 544 533 544 480L544 416C544 398.3 529.7 384 512 384C494.3 384 480 398.3 480 416L480 480C480 497.7 465.7 512 448 512L192 512C174.3 512 160 497.7 160 480L160 416z"/></svg></span></button></div> -->
       <!-- instructions -->
      <div class="instructions">
        <div class="instructions-overlay"></div>
        <div class="instructions-card">
          <div class="settings-card__row settings-card__row--top instructions-top">
            <p data-i18n="instructionsTitle" class="instructionsTitle"></p>
            <button class="btn-help btn-close open-help" tabindex="-1">            
              <i class="fa-solid fa-x fa-l open-help"></i>
            </button>
          </div>
          <div>
            <div class="instructions__image-frame"></div>
          </div>
          <div  class="instructions__text">
            <p data-i18n="instructions_line1"></p>
            <p data-i18n="instructions_line2"></p><br>
            <p data-i18n="instructions_line3"></p>
            <p data-i18n="instructions_line4"></p>
            <p data-i18n="instructions_line5"></p><br>
            <p data-i18n="instructions_line6"></p>
          </div>
        </div>
      </div>
      <!-- Settings -->
        <div class="settings">
          <div class="settings-overlay"></div>
          <div class="settings-card">
            <div class="settings-card__row settings-card__row--top">
              <h2 data-i18n="settingsTitle" class="settingsTitle"></h2>
              <button class="btn-settings btn-close open-settings" tabindex="-1">            
                <i class="fa-solid fa-x fa-xl open-settings"></i>
              </button>
            </div>
            <div  class="settings-card__row setting-option">
              <p data-i18n="language"></p>
              <div>
                <button class="languageBtn" data-lang="pt-BR"><i class="toggleIcon flag ">🇧🇷</i></button>
                <button class="languageBtn" data-lang="fr"><i class="toggleIcon flag ">🇫🇷</i></button>
                <button class="languageBtn" data-lang="en"><i class="toggleIcon flag ">🇬🇧</i></button>
                
              </div>
            </div>
            <div  class="settings-card__row setting-option darkModeBtn">
              <p data-i18n="darkMode"></p>
              <i   class="fa-solid fa-toggle-off toggleIcon"></i>
            </div>
            <div  class="settings-card__row setting-option">
              <p data-i18n="sound"></p>
              <i   class="fa-solid fa-toggle-on toggleIcon sound-btn"></i>
            </div>
          </div>
        </div>
    </main>
    <canvas class="js-confetti"></canvas>
    <footer class="footer">
      <div>
      <h3 class="footer-name">Valentin Robert</h3>
      <p>2026</p></div>
      <div class="link-icons">
      <a class="link-icon" href="https://www.linkedin.com/in/valentin-robert-186b98262/" target="_blank" rel="noopener noreferrer" title="My LinkedIn"><i class="fa-brands fa-linkedin fa-xl"></i></a>
      <a class="link-icon" href="https://github.com/YxngChai/" target="_blank" rel="noopener noreferrer" title="My GitHub"><i class="fa-brands fa-github fa-xl"></i></a></div>
    </footer>
  </body>
</html>
