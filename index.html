<!doctype html>
<html >
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="style/style.css" />
     <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script type="module" src="script/main.js" defer></script>
    
    <script
      src="https://kit.fontawesome.com/c8cb44d56f.js"
      crossorigin="anonymous"></script>
  <body>
    <header>
      <h1>
        <span>A</span>
        <span>L</span>
        <span>P</span>
        <span>H</span>
        <span>A</span>
        <span>M</span>
        <span>O</span>
        <span>T</span>
      </h1>
      <nav>
        <button class="btn-settings" title="Settings">          
           <i class="fa-solid fa-gear setting-wheel"></i>
        </button>
      </nav>
    </header>
    <main>
      <div class="app">
      </div>
      <div class="settings">
        <div class="settings-overlay"></div>
        <div class="settings-card">
          <div class="settings-card__row settings-card__row--top">
            <p data-i18n="settingsTitle"></p>
            <button class="btn-settings">            
              <i class="fa-regular fa-xmark setting-wheel"></i>
            </button>
          </div>
          <div  class="settings-card__row setting-option">
            <p data-i18n="language"></p>
            <div>
              <button class="languageBtn" data-lang="pt-BR"><i class="toggleIcon flag ">🇧🇷</i></button>
              <button class="languageBtn" data-lang="fr"><i class="toggleIcon flag ">🇫🇷</i></button>
              <button class="languageBtn" data-lang="en"><i class="toggleIcon flag ">🇬🇧</i></button>
              
            </div>
          </div>
          <div  class="settings-card__row setting-option darkModeBtn">
            <p data-i18n="darkMode"></p>
            <i   class="fa-solid fa-toggle-off toggleIcon"></i>
          </div>
          <div  class="settings-card__row setting-option">
            <p data-i18n="sound"></p>
            <i   class="fa-solid fa-toggle-off toggleIcon"></i>
          </div>
        </div>
      </div>
    </main>
    <canvas class="js-confetti"></canvas>

    <footer>
      <h3>Valentin Robert</h3>
      <p>2026</p>
      <br />
      <a href="https://www.linkedin.com/in/valentin-robert-186b98262/" target="_blank" rel="noopener noreferrer" title="My LinkedIn"><i class="fa-brands fa-linkedin fa-xl"></i></a>
      <a href="https://github.com/YxngChai/" target="_blank" rel="noopener noreferrer" title="My GitHub"><i class="fa-brands fa-github fa-xl"></i></a>
    </footer>
  </body>
</html>
