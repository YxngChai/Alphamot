<!doctype html>
<html >
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="style/style.css" />
     <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script type="module" src="script/main.js" defer></script>
    
    <script
      src="https://kit.fontawesome.com/c8cb44d56f.js"
      crossorigin="anonymous"></script>
  <body>
    <header>
      <h1>
        <span>A</span>
        <span>L</span>
        <span>P</span>
        <span>H</span>
        <span>A</span>
        <span>M</span>
        <span>O</span>
        <span>T</span>
      </h1>
      <nav>
        <button class="btn-help" title="Help">          
          <i class="fa-solid fa-question fa-xl setting-wheel"></i>        
        </button>
        <button class="btn-settings" title="Settings">          
           <i class="fa-solid fa-gear setting-wheel"></i>
        </button>
      </nav>
    </header>
    <main>
      <div class="app">
      </div>
      <div class="instructions">
        <div class="instructions-overlay"></div>
        <div class="instructions-card">
          <div class="settings-card__row settings-card__row--top instructions-top">
            <p data-i18n="instructionsTitle" class="instructionsTitle"></p>
            <button class="btn-help btn-close">            
              <i class="fa-solid fa-x fa-xl"></i>
            </button>
          </div>
          <div>
            <div class="instructions__image-frame"></div>
          </div>
          <div  class="instructions__text">
            <p data-i18n="instructions_line1"></p>
            <p data-i18n="instructions_line2"></p><br>
            <p data-i18n="instructions_line3"></p>
            <p data-i18n="instructions_line4"></p>
            <p data-i18n="instructions_line5"></p><br>
            <p data-i18n="instructions_line6"></p>
          </div>
        </div>
      </div>
      <!-- Settings -->
      <div class="settings">
        <div class="settings-overlay"></div>
        <div class="settings-card">
          <div class="settings-card__row settings-card__row--top">
            <h2 data-i18n="settingsTitle" class="settingsTitle"></h2>
            <button class="btn-settings btn-close">            
              <i class="fa-solid fa-x fa-xl"></i>
            </button>
          </div>
          <div  class="settings-card__row setting-option">
            <p data-i18n="language"></p>
            <div>
              <button class="languageBtn" data-lang="pt-BR"><i class="toggleIcon flag ">🇧🇷</i></button>
              <button class="languageBtn" data-lang="fr"><i class="toggleIcon flag ">🇫🇷</i></button>
              <button class="languageBtn" data-lang="en"><i class="toggleIcon flag ">🇬🇧</i></button>
              
            </div>
          </div>
          <div  class="settings-card__row setting-option darkModeBtn">
            <p data-i18n="darkMode"></p>
            <i   class="fa-solid fa-toggle-off toggleIcon"></i>
          </div>
          <div  class="settings-card__row setting-option">
            <p data-i18n="sound"></p>
            <i   class="fa-solid fa-toggle-off toggleIcon"></i>
          </div>
        </div>
      </div>
    </main>
    <canvas class="js-confetti"></canvas>

    <footer class="footer">
      <div>
      <h3 class="footer-name">Valentin Robert</h3>
      <p>2026</p></div>
      <div class="link-icons">
      <a class="link-icon" href="https://www.linkedin.com/in/valentin-robert-186b98262/" target="_blank" rel="noopener noreferrer" title="My LinkedIn"><i class="fa-brands fa-linkedin fa-xl"></i></a>
      <a class="link-icon" href="https://github.com/YxngChai/" target="_blank" rel="noopener noreferrer" title="My GitHub"><i class="fa-brands fa-github fa-xl"></i></a></div>
    </footer>
  </body>
</html>
